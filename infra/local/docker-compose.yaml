# =============================================================================
# infra/local/docker-compose.yaml
# Stack local de ReactorGuard para las pruebas de integracion y los benchmarks.
#
# NO es el cluster: un solo broker, sin replicacion, sin TLS y sin ACLs. Sirve para
# ejercitar los adaptadores de kafka-python contra un broker real y para medir el
# techo de un proceso productor. Una cifra medida aqui es INFORMATIVA; solo la
# medicion en el cluster cierra los criterios 1 y 3 de la Fase 2.
#
# Se maneja con .\infra\local\Invoke-LocalStack.ps1 (-Up, -Down, -Status).
#
# Servicios
#   kafka        Kafka KRaft de un nodo, PLAINTEXT. Host: 127.0.0.1:9092 (NO localhost:
#                en Windows resuelve primero a ::1, Docker publica solo IPv4 y
#                kafka-python agota el tiempo). Red de compose: kafka:19092.
#   kafka-init   Crea los tres topics del cluster y termina (restart: "no").
#   redis        Redis 7.2 sin contrasena, solo en 127.0.0.1 (online store de Feast,
#                M7). El puerto del host es 6380 porque 6379 lo suele ocupar otro
#                proyecto; se cambia con REACTORGUARD_REDIS_PORT.
#   prometheus   Perfil "observability". Scrapea los servicios que corren en el host.
#   grafana      Perfil "observability". Datasource de Prometheus ya provisionado.
#
# Diferencias deliberadas con k8s/base/kafka/ (documentadas para no confundir una
# cifra local con una del cluster):
#   - Kafka 3.7.0 y no 3.6.0: la imagen oficial apache/kafka empieza en 3.7.0.
#   - replication.factor 1 y min.insync.replicas 1 (un solo broker). Con acks=all el
#     productor solo espera al lider, asi que la latencia de escritura es MENOR que
#     la del cluster (3 replicas, min.insync.replicas 2).
#   - Mismas particiones (12/12/3) y misma retencion que k8s/base/kafka/kafka-topics.yaml.
# =============================================================================

name: reactorguard-local

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: reactorguard-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_NUM_PARTITIONS: "12"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # Sin espera inicial: un grupo nuevo se asigna al primer poll (el test no
      # debe pagar los 3 s por defecto en cada arranque de consumidor).
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: reactorguard-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        K=/opt/kafka/bin/kafka-topics.sh
        B=kafka:19092
        $$K --bootstrap-server $$B --create --if-not-exists --topic sensor-readings-raw \
          --partitions 12 --replication-factor 1 --config retention.ms=604800000
        $$K --bootstrap-server $$B --create --if-not-exists --topic sensor-validated \
          --partitions 12 --replication-factor 1 --config retention.ms=604800000
        $$K --bootstrap-server $$B --create --if-not-exists --topic anomaly-alerts \
          --partitions 3 --replication-factor 1 --config retention.ms=2592000000
        $$K --bootstrap-server $$B --list

  redis:
    image: redis:7.2-alpine
    container_name: reactorguard-redis
    ports:
      - "127.0.0.1:${REACTORGUARD_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.47.0
    container_name: reactorguard-prometheus
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:10.1.0
    container_name: reactorguard-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Solo local y solo en 127.0.0.1: la contrasena por defecto no sale de la maquina.
      GF_SECURITY_ADMIN_PASSWORD: "${REACTORGUARD_GRAFANA_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    depends_on:
      - prometheus
