[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reactorguard"
version = "0.1.0"
description = "Cloud-native anomaly detection platform for nuclear reactors"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # Deep Learning
    "torch>=2.2.0",
    "torchvision>=0.17.0",

    # API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",

    # Kafka
    "kafka-python>=2.0.2",

    # Feature Store
    "feast[gcp]>=0.36.0",

    # ML Experiment Tracking
    "mlflow>=2.11.0",

    # Data Versioning
    "dvc[gcs]>=3.49.0",

    # Conformal Prediction (uncertainty quantification)
    "mapie>=0.8.0",

    # Explainability
    "shap>=0.45.0",

    # Observability
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-exporter-otlp>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "prometheus-client>=0.20.0",

    # Data / Numerics
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",

    # GCP
    "google-cloud-storage>=2.16.0",
    "google-cloud-secret-manager>=2.19.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",           # async test client for FastAPI

    # Linting & Formatting
    "ruff>=0.4.0",

    # Type Checking
    "mypy>=1.9.0",
    "types-requests>=2.31.0",

    # Physics simulation (optional, heavy dep)
    # "openmc>=0.14.0",         # uncomment if running neutron transport locally
]

[tool.hatch.build.targets.wheel]
packages = ["api", "ml", "data", "observability"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
# Coverage se ejecuta explícitamente: pytest --cov=. --cov-report=term-missing --cov-fail-under=70
