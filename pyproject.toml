[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reactorguard"
version = "0.1.0"
description = "Cloud-native anomaly detection platform for nuclear reactors"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # Deep Learning
    "torch>=2.11.0",
    "torchvision>=0.26.0",

    # API
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.44.0",
    "pydantic>=2.12.5",

    # Kafka
    "kafka-python>=2.3.1",

    # Feature Store
    "feast[gcp]>=0.62.0",

    # ML Experiment Tracking
    "mlflow>=3.11.1",

    # Data Versioning
    "dvc[gcs]>=3.67.1",

    # Conformal Prediction (uncertainty quantification)
    "mapie>=1.3.0",

    # Explainability
    "shap>=0.51.0",

    # Observability
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-exporter-otlp>=1.41.0",
    "opentelemetry-instrumentation-fastapi>=0.62b0",
    "prometheus-client>=0.25.0",

    # Data / Numerics
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",

    # GCP
    "google-cloud-storage>=3.10.1",
    "google-cloud-secret-manager>=2.27.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",           # async test client for FastAPI

    # Linting & Formatting
    "ruff>=0.15.10",

    # Type Checking
    "mypy>=1.20.1",
    "types-requests>=2.33.0.20260408",

    # Physics simulation (optional, heavy dep)
    # "openmc>=0.14.0",         # uncomment if running neutron transport locally
]

[tool.hatch.build.targets.wheel]
packages = ["api", "ml", "data", "observability"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
# Coverage se ejecuta explícitamente: pytest --cov=. --cov-report=term-missing --cov-fail-under=70
