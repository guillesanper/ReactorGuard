# =============================================================================
# ReactorGuard - Pipeline de datos: TEP (Fase 2) y simulacion (Fase 3)
#
# Cada stage declara params explicitos y granulares: cambiar tep.plant_id debe
# invalidar adapt_tep pero no download_tep. Todos los parametros listados aqui
# se leen en tiempo de ejecucion via data/generators/tep_params.py, de modo que
# la invalidacion se corresponde con un cambio real de comportamiento.
#
# data/processed/tep vive fuera de data/raw/tep a proposito: anidar el out de
# adapt_tep dentro del out de download_tep es una colision que DVC rechaza.
#
# simulate (F3-M6) es una rama independiente: no lee nada del TEP y escribe
# data/raw/simulation, hermano de data/raw/tep (sin anidar outs). No cablea
# featurize/split/streamer (D13): eso es de Fase 4.
#
# prepare_sim (F4-M1) cuelga de simulate y escribe data/processed/sim_pinn, los
# datos de la PINN repartidos por run (D4-7, D4-8). Tampoco toca featurize/split.
# =============================================================================

stages:
  download_tep:
    cmd: python data/generators/tep_downloader.py
    deps:
      - data/generators/tep_downloader.py
      - data/generators/tep_params.py
    params:
      - tep.raw_dir
    outs:
      - data/raw/tep

  explore_tep:
    cmd: python data/generators/tep_explorer.py
    deps:
      - data/generators/tep_explorer.py
      - data/generators/tep_loader.py
      - data/generators/tep_params.py
      - data/raw/tep
    params:
      - tep.raw_dir
      - tep.reports_dir
    outs:
      - data/reports

  adapt_tep:
    cmd: python data/generators/adapt_tep.py
    deps:
      - data/generators/adapt_tep.py
      - data/generators/tep_adapter.py
      - data/generators/tep_loader.py
      - data/generators/tep_params.py
      - data/schemas/sensor_reading.py
      - data/schemas/sensor_spans.py
      - data/raw/tep
      # El contenido de la tabla de spans entra como dep, no como param: 52
      # entradas inflarian params.yaml y DVC versiona ficheros por hash igual de
      # bien. Solo la ruta viaja por params (tep.spans_path).
      - configs/sensor_spans.yaml
    params:
      - tep.raw_dir
      - tep.processed_dir
      - tep.plant_id
      - tep.start_time
      - tep.sample_interval_minutes
      - tep.spans_path
      - tep.calibration_date
      - tep.last_maintenance_date
      - tep.drift_coefficient
    outs:
      - data/processed/tep

  featurize:
    cmd: python ml/features/batch_featurizer.py
    deps:
      - ml/features/batch_featurizer.py
      - ml/features/pipeline.py
      - ml/features/feature_params.py
      - ml/features/kalman.py
      - data/generators/tep_params.py
      - data/processed/tep
    params:
      # tep.processed_dir es de donde LEE: el out de adapt_tep. Se declara aunque
      # la dependencia de fichero ya este arriba, porque cambiar la ruta cambia
      # que se lee, no solo cuando se reejecuta.
      - tep.processed_dir
      - features.features_dir
      - features.window_samples
      - features.min_samples_per_window
      - features.n_lags
      - features.sensor_selection
      - features.correlation_pairs
    outs:
      - data/processed/features

  feast_source:
    cmd: python ml/features/store/source_builder.py
    deps:
      - ml/features/store/source_builder.py
      - ml/features/store/feature_store_params.py
      - ml/features/batch_featurizer.py
      - ml/features/feature_params.py
      - ml/features/pipeline.py
      - data/generators/tep_params.py
      - data/processed/features
    params:
      # Origen y cadencia de la linea de tiempo sintetica.
      - tep.start_time
      - tep.sample_interval_minutes
      # De donde LEE (el out de featurize) y la politica de sensores que contrasta.
      - features.features_dir
      - features.window_samples
      - features.n_lags
      - features.correlation_pairs
      - features.sensor_selection
      # Donde ESCRIBE y como separa los runs. ttl_intervals no se declara: solo
      # lo usa el FeatureView en tiempo de ejecucion, no altera este artefacto.
      - feature_store.source_path
      - feature_store.run_gap_intervals
    outs:
      - data/processed/feast_source/sensor_features.parquet

  split:
    cmd: python data/generators/train_val_test_split.py
    deps:
      - data/generators/train_val_test_split.py
      - ml/features/batch_featurizer.py
      - ml/features/feature_params.py
      - data/processed/features
    params:
      - features.features_dir
      - training.splits_dir
      - training.metrics_path
      - training.distribution_path
      - training.train_ratio
      - training.val_ratio
      - training.test_ratio
    outs:
      - data/processed/splits
      # El desglose por clase, fuera de `metrics:` para no reventar la tabla de
      # `dvc metrics show`, pero versionado igual con cache: false.
      - metrics/split_distribution.json:
          cache: false
    metrics:
      # cache: false lo saca de la cache de DVC y lo deja en git, que es la
      # condicion para que `dvc metrics diff` pueda comparar dos commits.
      - metrics/split_metrics.json:
          cache: false

  simulate:
    # --workers 0 = un proceso por CPU. La salida no depende del numero de
    # procesos (cada run cuelga de su semilla; test de determinismo en
    # tests/safety), asi que no es un param. El vacio domina el coste
    # (Docs/physics_constraints.md, 14.1).
    cmd: python data/generators/reactor_simulator.py --workers 0
    deps:
      - data/generators/reactor_simulator.py
      # Directorio de codigo: modelo, fallos, planificador, cobertura y escritura.
      - data/simulation
      - data/schemas/sensor_reading.py
      - data/schemas/sensor_spans.py
      # READING_ID_NAMESPACE y el contrato de readings_from_frame.
      - data/generators/tep_adapter.py
      # Contenido de las tablas como dep (como configs/sensor_spans.yaml en
      # adapt_tep); solo sus rutas viajan por params.
      - configs/sim_sensors.yaml
      - configs/sim_sensor_spans.yaml
      - configs/plant_parameters.yaml
      - configs/neutronics_coefficients.yaml
      - configs/water_table.yaml
    params:
      - simulation.n_samples
      - simulation.fault_injection_rate
      - simulation.critical_min_fraction
      - simulation.severity_weights
      - simulation.openmc_seed
      - simulation.dt_seconds
      - simulation.run_length_steps
      - simulation.warmup_fraction
      - simulation.start_time
      - simulation.plant_id
      - simulation.load_min_fraction
      - simulation.load_max_fraction
      - simulation.max_ramp_percent_per_min
      - simulation.load_hold_minutes_min
      - simulation.load_hold_minutes_max
      - simulation.output_dir
      - simulation.metrics_path
      - simulation.plant_parameters_path
      - simulation.neutronics_path
      - simulation.sensors_path
      - simulation.spans_path
      - simulation.water_table_path
      - simulation.calibration_date
      - simulation.last_maintenance_date
      - simulation.drift_coefficient
    outs:
      # Un parquet por run (fault_type=<escenario>/seed=<n>/sim_run_<NNN>.parquet,
      # TDD 4.4) y manifest.json con el sha256 de cada uno.
      - data/raw/simulation
    metrics:
      - metrics/simulation_metrics.json:
          cache: false

  prepare_sim:
    # F4-M1 (D4-8): datos de la PINN desde el dataset simulado. Rama independiente
    # del TEP: no toca featurize ni split. Lee solo las columnas que necesita y
    # comprueba el sha256 de cada run contra el manifiesto de simulate.
    cmd: python ml/training/prepare_sim.py
    deps:
      - ml/training/prepare_sim.py
      - ml/training/sim_dataset.py
      - ml/training/pinn_params.py
      # Directorio de codigo que importa: manifiesto, etiquetas, cobertura,
      # catalogo, escenarios y loaders de parametros.
      - data/simulation
      # Catalogo (orden de columnas) y umbrales de cobertura de D6
      # (scenario_planner.k_min_readings y n_min_episodes).
      - configs/sim_sensors.yaml
      - configs/plant_parameters.yaml
      - data/raw/simulation
    params:
      - pinn.data_dir
      - pinn.metrics_path
      - pinn.val_runs_per_scenario
      - pinn.test_runs_per_scenario
      # De donde LEE: el out de simulate y las tablas que lo describen.
      - simulation.output_dir
      - simulation.sensors_path
      - simulation.plant_parameters_path
    outs:
      - data/processed/sim_pinn
    metrics:
      - metrics/sim_pinn_metrics.json:
          cache: false
