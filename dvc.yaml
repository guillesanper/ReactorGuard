# =============================================================================
# ReactorGuard - Pipeline de datos TEP
#
# Cada stage declara params explicitos y granulares: cambiar tep.plant_id debe
# invalidar adapt_tep pero no download_tep. Todos los parametros listados aqui
# se leen en tiempo de ejecucion via data/generators/tep_params.py, de modo que
# la invalidacion se corresponde con un cambio real de comportamiento.
#
# data/processed/tep vive fuera de data/raw/tep a proposito: anidar el out de
# adapt_tep dentro del out de download_tep es una colision que DVC rechaza.
# =============================================================================

stages:
  download_tep:
    cmd: python data/generators/tep_downloader.py
    deps:
      - data/generators/tep_downloader.py
      - data/generators/tep_params.py
    params:
      - tep.raw_dir
    outs:
      - data/raw/tep

  explore_tep:
    cmd: python data/generators/tep_explorer.py
    deps:
      - data/generators/tep_explorer.py
      - data/generators/tep_loader.py
      - data/generators/tep_params.py
      - data/raw/tep
    params:
      - tep.raw_dir
      - tep.reports_dir
    outs:
      - data/reports

  adapt_tep:
    cmd: python data/generators/adapt_tep.py
    deps:
      - data/generators/adapt_tep.py
      - data/generators/tep_adapter.py
      - data/generators/tep_loader.py
      - data/generators/tep_params.py
      - data/schemas/sensor_reading.py
      - data/schemas/sensor_spans.py
      - data/raw/tep
      # El contenido de la tabla de spans entra como dep, no como param: 52
      # entradas inflarian params.yaml y DVC versiona ficheros por hash igual de
      # bien. Solo la ruta viaja por params (tep.spans_path).
      - configs/sensor_spans.yaml
    params:
      - tep.raw_dir
      - tep.processed_dir
      - tep.plant_id
      - tep.start_time
      - tep.sample_interval_minutes
      - tep.spans_path
      - tep.calibration_date
      - tep.last_maintenance_date
      - tep.drift_coefficient
    outs:
      - data/processed/tep

  featurize:
    cmd: python ml/features/batch_featurizer.py
    deps:
      - ml/features/batch_featurizer.py
      - ml/features/pipeline.py
      - ml/features/feature_params.py
      - ml/features/kalman.py
      - data/generators/tep_params.py
      - data/processed/tep
    params:
      # tep.processed_dir es de donde LEE: el out de adapt_tep. Se declara aunque
      # la dependencia de fichero ya este arriba, porque cambiar la ruta cambia
      # que se lee, no solo cuando se reejecuta.
      - tep.processed_dir
      - features.features_dir
      - features.window_samples
      - features.min_samples_per_window
      - features.n_lags
      - features.sensor_selection
      - features.correlation_pairs
    outs:
      - data/processed/features

  split:
    cmd: python data/generators/train_val_test_split.py
    deps:
      - data/generators/train_val_test_split.py
      - ml/features/batch_featurizer.py
      - ml/features/feature_params.py
      - data/processed/features
    params:
      - features.features_dir
      - training.splits_dir
      - training.metrics_path
      - training.distribution_path
      - training.train_ratio
      - training.val_ratio
      - training.test_ratio
    outs:
      - data/processed/splits
      # El desglose por clase, fuera de `metrics:` para no reventar la tabla de
      # `dvc metrics show`, pero versionado igual con cache: false.
      - metrics/split_distribution.json:
          cache: false
    metrics:
      # cache: false lo saca de la cache de DVC y lo deja en git, que es la
      # condicion para que `dvc metrics diff` pueda comparar dos commits.
      - metrics/split_metrics.json:
          cache: false
