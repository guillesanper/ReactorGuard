#                           fuera-de-rango en data/validation/sensor_validator.py.
#
# Si cambia el catalogo, el sigma de ruido o el programa de carga hay que
# regenerarlo: un span derivado de otro ruido deja de ser el de esta planta.
# ==========================================================================

