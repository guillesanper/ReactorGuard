# ==========================================================================
# ReactorGuard - Parametros de planta del modelo termico (PWR de referencia)
#
# Leido por data/simulation/plant_params.py (load_plant_params). Es un PWR
# generico de 4 lazos y ~3000 MWt: NO modela una planta concreta ni se ha
# contrastado con datos reales (ver F3-M3, limitaciones). Cada valor lleva su
# origen. "Preflight" = sonda medida en F3-M0 (Docs/ReactorGuard_Fase3_Plan.md).
#
# El equilibrio nominal NO se teclea: hA (combustible -> refrigerante) y UA
# (primario -> secundario) se DERIVAN en ReactorModel para que el punto nominal
# sea un equilibrio exacto de las ecuaciones.
# ==========================================================================

plant:
  # --- Punto nominal ---
  thermal_power_mw: 3000.0        # PWR de 4 lazos tipo Westinghouse (TDD 5.2 usa ~3,0e9 W)
  nominal_flow_kg_s: 18000.0      # 4 lazos x 4500 kg/s (preflight)
  nominal_pressure_bar: 155.0     # 15,5 MPa, presion del primario (preflight)
  t_in_nominal_c: 291.0           # pierna fria nominal (plan F3-M1)
  t_fuel_nominal_c: 620.0         # combustible promediado en volumen, orden de magnitud PWR
  t_secondary_nominal_c: 280.0    # saturacion del GV, ~64 bar (6,4 MPa)

  # --- Capacidades termicas [MJ/K] (nodo = masa x cp) ---
  capacity_fuel_mj_k: 30.0        # ~100 t de UO2 x ~0,3 kJ/(kg K)
  capacity_core_mj_k: 120.0       # ~20 t de agua en el nucleo (~5,7 kJ/(kg K)) + vainas
  capacity_sg_mj_k: 800.0         # resto del agua del primario y estructuras acopladas

  # --- Constantes de tiempo [s] ---
  tau_pump_s: 10.0                # inercia de la bomba (volante), orden de decenas de s
  tau_pressurizer_s: 60.0         # control de presion del presurizador
  tau_void_s: 5.0                 # relajacion del vacio hacia su valor cuasi-estatico
  tau_calorimetric_s: 30.0        # retardo del canal de potencia calorimetrica

  # --- Presion, vacio y secundario ---
  pressurizer_gain_bar_per_k: 1.0   # dP/dT_avg del presurizador, orden de 1 bar/K
  void_onset_offset_k: 2.0          # ebullicion subenfriada: el vacio empieza a T_sat - offset
  void_ramp_width_k: 20.0           # K de exceso sobre el umbral por unidad de vacio (sin tope)
  void_max_fraction: 0.5            # tope del vacio en el modelo (fraccion de volumen)
  t_ref_slope_k_per_load: 5.0       # programa de T_avg: T_ref = T_avg0 + slope * (carga - 1); T_sec lo sigue
  surge_kg_s_per_k_s: 900.0         # caudal de insurge por dT_avg/dt: V_presurizador (~300 m3) x |d(rho)/dT| (~3 kg/m3/K)

# --- Controlador PI de barras (T_avg -> reactividad) ---
control:
  rod_kp_per_k: 2.0e-4              # [dk/k por K de error]
  rod_ki_per_k_s: 2.0e-6            # [dk/k por K s de error integrado]
  tau_rod_s: 10.0                   # retardo mecanico de las barras

# --- Limites de constraints (los usa physics_constraints.py en F3-M2) ---
limits:
  max_dt_c_per_s: 10.0              # TDD 5.4 y Appendix B (D9)
  energy_imbalance_fraction: 0.05   # TDD 5.4: |Q_gen - Q_rem| / Q_gen > 5 %
  pump_max_fraction: 1.10           # tope de bomba como fraccion del caudal nominal

  # --- Anadidos en F3-M2 (Docs/physics_constraints.md, seccion 6). PROVISIONALES: ---
  # --- F3-M3 los recalibra con la operacion normal y el ruido definitivos. ---
  # Regla de los umbrales medidos: pico del estado VERDADERO en una rampa normal de
  # 5 %/min + 5 sigma del estadistico con el ruido inicial del catalogo.
  n_loops: 4                        # lazos del primario: cada canal de caudal mide total / n_loops
  mass_balance_tolerance: 0.055     # |m_hl - m_cl| / m en cuasi-estacionario: 0,0020 + 5 x 0,0100
  quasi_steady_dt_avg_k_s: 0.02     # |dT_avg/dt| [K/s]: >= 0,0114 (rampa 5 %/min + 5 sigma) y <= tol/0,05
  power_flux_k: 1.0                 # P_th [%] frente a k x flujo [%]: ambos normalizados al nominal
  power_flux_threshold_percent: 4.5 # |P_th - k flux| [pp]: 2,26 (retardo 30 s en 5 %/min) + 5 x 0,40
  conservation_tolerance: 1.0e-6    # residuo relativo de conservacion de energia (D7); medido 2e-15

# --- Niveles de magnitud de los fallos de proceso (F3-M4) ---
# Leido por data/simulation/process_faults.py (parse_fault_tiers). Cada nivel lleva el
# parametro que lo gobierna y, en `expect:`, la banda MEDIBLE que lo define: la
# respuesta del modelo a carga constante 1,0, sin ruido, con el fallo persistente
# (measure_level_response). Un test comprueba que la medida cae en la banda.
# Rango de validez (tabla de agua sin extrapolar): insercion <= 700 pcm, demanda
# de bomba >= 0,45 (a carga 1,0 el acantilado de ebullicion esta en 0,40-0,41),
# margen de saturacion del vacio entre -16 y +5 K.
# Bandas medidas en F3-M4 (carga 1,0, 5 muestras de calentamiento y 60 de respuesta).
fault_tiers:
  core_temp_excursion:
    onset_minutes: 30.0             # rampa lineal de insercion de reactividad
    hold_steps: 120                 # 6 h a 180 s a magnitud plena (defecto de process_run_plan)
    recovery_steps: 20              # 1 h de retorno lineal; 0 = termina de golpe
    levels:
      low:                          # medido: T_out +2,84 K, n 1,073, margen 22,2 K
        reactivity_pcm: 100.0
        expect: {t_out_rise_k: [2.0, 4.0], n_peak: [1.04, 1.10]}
      medium:                       # medido: T_out +8,47 K, n 1,220, margen 18,4 K
        reactivity_pcm: 300.0
        expect: {t_out_rise_k: [7.0, 10.0], n_peak: [1.18, 1.26]}
      high:                         # medido: T_out +16,75 K, n 1,439, margen 12,9 K
        reactivity_pcm: 600.0
        expect: {t_out_rise_k: [15.0, 18.5], n_peak: [1.40, 1.48], margin_min_k: [11.0, 14.5]}

  coolant_flow_reduction:
    onset_minutes: 0.0              # la dinamica es la constante de tiempo
    time_constant_minutes: 5.0      # la demanda cae como 1 - exp(-t / tau)
    oscillation_period_s: 300.0     # < 360 s (Nyquist a 180 s): se aliasa a 450 s
    hold_steps: 120
    recovery_steps: 20
    levels:
      low:                          # medido: caudal 13.335 kg/s, T_out +5,19 K, margen 18,9 K
        demand_fraction: 0.75
        oscillation_amplitude: 0.01
        expect: {flow_min_kg_s: [12500.0, 14000.0], margin_min_k: [17.0, 21.0]}
      medium:                       # medido: caudal 10.470 kg/s, T_out +10,65 K, margen 13,5 K
        demand_fraction: 0.60
        oscillation_amplitude: 0.02
        expect: {flow_min_kg_s: [9800.0, 11200.0], margin_min_k: [12.0, 15.0]}
      high:                         # medido: caudal 7.604 kg/s, T_out +20,19 K, margen 3,9 K
        demand_fraction: 0.45
        oscillation_amplitude: 0.03
        expect: {flow_min_kg_s: [7000.0, 8200.0], margin_min_k: [2.5, 5.5], t_out_rise_k: [18.0, 22.0]}

  void_formation:
    onset_minutes: 30.0             # rampa lineal de la fuga
    hold_steps: 120
    recovery_steps: 20
    # El nivel es el margen de saturacion T_sat(P) - T_out OBJETIVO en lazo abierto
    # [K]: la fuga se calcula sobre el equilibrio de la carga vigente (la misma fuga
    # en bar daba consecuencias distintas a 70 y a 100 %). Negativo = ebullicion.
    # Las bandas valen a carga 0,7 y 1,0 (medido en ambas).
    levels:
      low:                          # vacio incipiente: la regla 6 no dispara (void 0,003-0,020)
        saturation_margin_k: 1.5
        expect: {void_peak: [0.0005, 0.04], margin_min_k: [0.5, 3.0]}
      medium:                       # ebullicion franca (void 0,16-0,17, margen -1,7 a -3,3 K)
        saturation_margin_k: 0.0
        expect: {void_peak: [0.10, 0.25], margin_min_k: [-5.0, -0.5]}
      high:                         # vacio casi al tope 0,5 (void 0,41-0,44, margen -12 a -13 K)
        saturation_margin_k: -8.0
        expect: {void_peak: [0.35, 0.50], margin_min_k: [-16.0, -10.0]}
