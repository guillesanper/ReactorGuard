# ==========================================================================
# ReactorGuard - Spans calibrados por transmisor
#
# GENERADO por data/generators/derive_sensor_spans.py. Se revisa a mano y se
# commitea; no es un artefacto de `dvc repro`.
#
#   Derivado de : d00.dat (operacion normal, exclusivamente)
#   Margen span : 200% a cada lado del rango observado
#   Margen alarma: 20% a cada lado del rango observado
#
# Dos rangos por sensor, porque sus consumidores necesitan anchos distintos:
#
#   [min, max]              span calibrado del transmisor. Escalado a cuentas
#                           ADC en data/generators/tep_adapter.py. Todo lo que
#                           cae fuera se recorta de forma irreversible, asi que
#                           es deliberadamente ancho.
#   [alarm_min, alarm_max]  sobre de operacion normal. Umbral del detector de
#                           fuera-de-rango en data/validation/sensor_validator.py.
#
# Ambos se leen a traves de data/schemas/sensor_spans.py, de modo que no
# existan dos respuestas a que es un valor valido para un canal dado.
# ==========================================================================

