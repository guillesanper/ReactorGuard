# serviceaccount.yaml — KSAs pinn-server y mlflow-server con Workload Identity
# ---------------------------------------------------------------------------
# Flujo Workload Identity (sin credenciales estáticas):
#
#   Pod (usa KSA pinn-server / mlflow-server)
#     │
#     ▼  GKE detecta la anotación iam.gke.io/gcp-service-account
#   KSA (Kubernetes Service Account)
#     │
#     ▼  GKE Metadata Server intercambia token K8s por token GCP
#   GSA (Google Service Account: reactorguard-ml-sa / reactorguard-mlflow-sa)
#     │
#     ▼  Token de la GSA disponible en el pod (ADC Application Default Credentials)
#   GCP APIs (Secret Manager, GCS, Vertex AI Monitoring)
#
# Los bindings IAM que permiten la impersonación fueron creados en T1.6.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# pinn-server: accede a GCS (modelos serializados), Secret Manager (JWT secret),
#              y escribe métricas de monitoring.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pinn-server
  namespace: reactorguard-ml
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: reactorguard
    app.kubernetes.io/component: ml-serving
  annotations:
    # Workload Identity: pinn-server → reactorguard-ml-sa
    # Permisos GSA: storage.objectViewer, secretmanager.secretAccessor, monitoring.metricWriter
    iam.gke.io/gcp-service-account: reactorguard-ml-sa@reactorguard-platform.iam.gserviceaccount.com
---
# ---------------------------------------------------------------------------
# mlflow-server: accede a GCS con permisos de admin para artefactos MLflow
#                (modelos, métricas, parámetros de experimentos).
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow-server
  namespace: reactorguard-ml
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: reactorguard
    app.kubernetes.io/component: ml-tracking
  annotations:
    # Workload Identity: mlflow-server → reactorguard-mlflow-sa
    # Permisos GSA: storage.objectAdmin (buckets mlflow-artifacts y models)
    iam.gke.io/gcp-service-account: reactorguard-mlflow-sa@reactorguard-platform.iam.gserviceaccount.com
