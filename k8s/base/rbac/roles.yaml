# roles.yaml — Roles y RoleBindings para KSAs de ReactorGuard
# ---------------------------------------------------------------------------
# Principio de menor privilegio: cada KSA solo puede leer (get/list/watch)
# ConfigMaps y Secrets de su propio namespace. No hay permisos entre namespaces.
#
# Estructura por namespace:
#   reactorguard-ingestion: sensor-validator-role + sensor-validator-binding
#   reactorguard-ml:        pinn-server-role + pinn-server-binding
#                           mlflow-server-role + mlflow-server-binding
# ---------------------------------------------------------------------------


# ===========================================================================
# NAMESPACE: reactorguard-ingestion
# KSA sensor-validator necesita leer ConfigMaps (configuración del validador)
# y Secrets (credenciales de Kafka, umbrales de detección de anomalías)
# ===========================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sensor-validator-role
  namespace: reactorguard-ingestion
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: reactorguard
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sensor-validator-binding
  namespace: reactorguard-ingestion
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: reactorguard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sensor-validator-role
subjects:
  - kind: ServiceAccount
    name: sensor-validator
    namespace: reactorguard-ingestion


# ===========================================================================
# NAMESPACE: reactorguard-ml
# KSA pinn-server necesita leer ConfigMaps (parámetros del modelo PINN)
# y Secrets (JWT secret para autenticar requests a la API de inferencia)
# ===========================================================================

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pinn-server-role
  namespace: reactorguard-ml
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: reactorguard
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pinn-server-binding
  namespace: reactorguard-ml
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: reactorguard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pinn-server-role
subjects:
  - kind: ServiceAccount
    name: pinn-server
    namespace: reactorguard-ml


# ===========================================================================
# NAMESPACE: reactorguard-ml
# KSA mlflow-server necesita leer ConfigMaps (URI del backend de tracking)
# y Secrets (credenciales de base de datos MLflow si se usa PostgreSQL)
# ===========================================================================

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlflow-server-role
  namespace: reactorguard-ml
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: reactorguard
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflow-server-binding
  namespace: reactorguard-ml
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: reactorguard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mlflow-server-role
subjects:
  - kind: ServiceAccount
    name: mlflow-server
    namespace: reactorguard-ml
