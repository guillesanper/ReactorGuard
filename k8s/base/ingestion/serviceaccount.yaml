# serviceaccount.yaml — KSA sensor-validator con Workload Identity
# ---------------------------------------------------------------------------
# Flujo Workload Identity (sin credenciales estáticas):
#
#   Pod (usa KSA sensor-validator)
#     │
#     ▼  GKE detecta la anotación iam.gke.io/gcp-service-account
#   KSA (Kubernetes Service Account)
#     │
#     ▼  GKE Metadata Server intercambia token K8s por token GCP
#   GSA (Google Service Account: reactorguard-ingestion-sa)
#     │
#     ▼  Token de la GSA inyectado en el pod
#   GCP APIs (Secret Manager, GCS, Pub/Sub)
#
# El binding IAM que permite la impersonación fue creado en T1.6:
#   serviceAccount:sentinel-platform-485714.svc.id.goog[reactorguard-ingestion/sensor-validator]
# ---------------------------------------------------------------------------

apiVersion: v1
kind: ServiceAccount
metadata:
  name: sensor-validator
  namespace: reactorguard-ingestion
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: reactorguard
    app.kubernetes.io/component: ingestion
  annotations:
    # Workload Identity: asocia esta KSA con la GSA de GCP.
    # GKE inyecta automáticamente las credenciales de la GSA en los pods que usen esta KSA.
    iam.gke.io/gcp-service-account: reactorguard-ingestion-sa@sentinel-platform-485714.iam.gserviceaccount.com
