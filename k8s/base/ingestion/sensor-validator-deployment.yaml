# =============================================================================
# k8s/base/ingestion/sensor-validator-deployment.yaml
# Consumidor de validacion (T3.5): sensor-readings-raw -> sensor-validated y
# anomaly-alerts. Servicio: data/validation/validation_service.py.
#
# IDENTIDAD.
#   - Kafka: KafkaUser `reactorguard-validator` por mTLS (listener 9093). Su Secret y el
#     CA del cluster viven en kafka-operator y se copian a este namespace con
#     infra/scripts/Sync-KafkaCredentials.ps1 (un pod no monta Secrets de otro
#     namespace). Si faltan, el pod queda en ContainerCreating.
#   - GCP: KSA `sensor-validator` (Workload Identity, serviceaccount.yaml).
#
# REPLICAS Y ESTADO. 2 replicas reparten las 12 particiones del grupo
# `sensor-validator` (6 cada una). Los detectores guardan estado en memoria por sensor,
# asi que CADA rebalanceo (arranque, rollout, desalojo de un nodo preemptible) resetea
# los sensores de las particiones que cambian de dueno y cuesta 8 muestras = 24 minutos
# a cadencia TEP volver a detectar un sensor congelado. No es un fallo del detector (D6
# del plan). Por eso el rollout sustituye UN pod cada vez y sin sobrepasar las replicas.
# El paralelismo maximo util es 12 replicas (una particion cada una).
#
# TERMINACION. terminationGracePeriodSeconds cubre el peor caso de un lote en curso:
#   flush_timeout_s + (commit_retries + 1) * commit_timeout_ms + close_timeout_ms
#   = 30 s + 4 * 30 s + 5 s = 155 s  ->  180 s.
# Un test lo recalcula desde params.yaml; si se recalibran esos tiempos, falla.
#
# RECURSOS. requests/limits INICIALES, no medidos (el cluster no existe): se fijan con
# `kubectl top` al desplegar. La imagen es la unica de api/Dockerfile, con torch
# dentro aunque este servicio no lo usa (deuda de empaquetado, Fase 6).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-validator
  namespace: reactorguard-ingestion
  labels:
    app.kubernetes.io/name: sensor-validator
    app.kubernetes.io/part-of: reactorguard
    app.kubernetes.io/component: validation
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sensor-validator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sensor-validator
        app.kubernetes.io/part-of: reactorguard
        app.kubernetes.io/component: validation
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: sensor-validator
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      nodeSelector:
        node-pool: platform
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sensor-validator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sensor-validator
          # Mutable a proposito hasta Fase 6/7: CI publica :latest y :<sha>. Un overlay
          # fijara el sha con el bloque `images:` de kustomize.
          image: gcr.io/sentinel-platform-485714/reactorguard-api:latest
          imagePullPolicy: Always
          command: ["python", "-m", "data.validation.validation_service"]
          args: ["--params", "/etc/reactorguard/params.yaml"]
          ports:
            - name: health
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: KAFKA_BOOTSTRAP
              value: reactorguard-cluster-kafka-bootstrap.kafka-operator.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_CAFILE
              value: /etc/kafka/ca/ca.crt
            - name: KAFKA_SSL_CERTFILE
              value: /etc/kafka/user/user.crt
            - name: KAFKA_SSL_KEYFILE
              value: /etc/kafka/user/user.key
            - name: LOG_LEVEL
              value: INFO
            # Raiz de solo lectura: sin .pyc y con HOME en el emptyDir.
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: params
              mountPath: /etc/reactorguard
              readOnly: true
            - name: kafka-user
              mountPath: /etc/kafka/user
              readOnly: true
            - name: kafka-ca
              mountPath: /etc/kafka/ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: params
          configMap:
            name: reactorguard-params
        # Certificado y clave del KafkaUser. 0440 + fsGroup 1000: legible por el grupo
        # del proceso y por nadie mas.
        - name: kafka-user
          secret:
            secretName: reactorguard-validator
            defaultMode: 0440
            items:
              - key: user.crt
                path: user.crt
              - key: user.key
                path: user.key
        - name: kafka-ca
          secret:
            secretName: reactorguard-cluster-cluster-ca-cert
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
# Con 2 replicas y minAvailable 1, un desalojo voluntario (drain de un nodo) nunca deja
# el grupo de consumo sin ningun miembro. No protege de una caida involuntaria.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sensor-validator
  namespace: reactorguard-ingestion
  labels:
    app.kubernetes.io/name: sensor-validator
    app.kubernetes.io/part-of: reactorguard
    app.kubernetes.io/component: validation
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sensor-validator
