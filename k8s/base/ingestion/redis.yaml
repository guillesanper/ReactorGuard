# =============================================================================
# k8s/base/ingestion/redis.yaml
# Redis del online store de Feast (T4.3): StatefulSet + Service + PVC.
#
# Un solo nodo, con persistencia RDB en un PersistentVolumeClaim. No es la fuente de
# verdad: el online store se reconstruye con `feast materialize` desde el offline
# store, asi que perderlo cuesta un rematerializado, no datos. Por eso no hay replica
# ni Sentinel. Si el SLA de lectura online lo exigiera, es un cambio de diseno.
#
# CONTRASENA. Redis exige `requirepass`. La contrasena vive SOLO en el Secret
# `redis-credentials` (clave `password`) del namespace reactorguard-ingestion, que se
# crea FUERA DE BANDA y nunca esta en el repositorio:
#
#   $password = -join ((48..57) + (97..122) | Get-Random -Count 48 | ForEach-Object { [char]$_ })
#   kubectl create secret generic redis-credentials `
#       --namespace reactorguard-ingestion --from-literal=password=$password
#
# Alfanumerica a proposito: se vuelca a un fichero de configuracion de Redis y un
# espacio o una comilla la romperian. Los clientes de otros namespaces (Feast en
# reactorguard-ml) necesitan su propia copia del Secret: un pod no monta Secrets de
# otro namespace. Eso es trabajo de M7.
#
# La contrasena NO va en los argumentos del proceso (`--requirepass` se veria en
# /proc/<pid>/cmdline): el arranque la escribe en un fichero de un emptyDir en memoria,
# con permisos 0600, que redis.conf incluye con `include`.
#
# Valores de memoria y recursos: INICIALES, no medidos. El online store son 52 sensores
# x 28 features; se fijan midiendo en el cluster (M7).
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: reactorguard-ingestion
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: reactorguard
    app.kubernetes.io/component: feature-store
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    protected-mode yes
    dir /data
    # Snapshot si hay al menos 1 cambio en 5 minutos: a cadencia TEP (180 s) llegan
    # escrituras cada 3 minutos, asi que el snapshot se dispara casi siempre.
    save 300 1
    appendonly no
    # noeviction: ante memoria llena Redis rechaza la escritura con error. Expulsar
    # features en silencio devolveria nulos que el servicio podria tomar por caducidad.
    maxmemory 256mb
    maxmemory-policy noeviction
    include /run/redis/auth.conf
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: reactorguard-ingestion
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: reactorguard
    app.kubernetes.io/component: feature-store
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: reactorguard-ingestion
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: reactorguard
    app.kubernetes.io/component: feature-store
spec:
  replicas: 1
  serviceName: redis-service
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: reactorguard
        app.kubernetes.io/component: feature-store
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        node-pool: platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              umask 077
              printf 'requirepass %s\n' "$REDIS_PASSWORD" > /run/redis/auth.conf
              exec redis-server /etc/redis/redis.conf
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
            # Lo lee redis-cli en las sondas; evita pasar la contrasena como argumento.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-config
              mountPath: /etc/redis
              readOnly: true
            - name: redis-run
              mountPath: /run/redis
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
        - name: redis-run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
  volumeClaimTemplates:
    - metadata:
        name: redis-data
        labels:
          app.kubernetes.io/name: redis
          app.kubernetes.io/part-of: reactorguard
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 1Gi
