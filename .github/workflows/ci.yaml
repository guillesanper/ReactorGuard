# CI Pipeline — ReactorGuard
# Safety-critical system: every commit must pass lint, tests, and security scans
# before a container image is built and pushed to the registry.
#
# Job order:
#   lint-and-typecheck → unit-tests ──┐
#                     → security-scan ┴→ build-and-push

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: gcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint & Type-check
  # Catches style violations and type errors early — cheap and fast.
  # For a safety-critical system, type correctness prevents subtle runtime bugs
  # in sensor validation and anomaly detection logic.
  # ---------------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install ruff mypy

      # ruff: sin --select, para heredar el select de [tool.ruff.lint] en
      # pyproject.toml. Una sola fuente de verdad: CI no puede ser mas laxo que
      # la configuracion del repo.
      - name: Run ruff
        run: ruff check .

      # mypy: static type analysis — critical for catching type errors in ML/physics code
      - name: Run mypy
        run: mypy ml/ api/ data/ --ignore-missing-imports

  # ---------------------------------------------------------------------------
  # Job 2: Unit Tests
  # Validates core logic in isolation — physics constraints, sensor validators,
  # and ML utility functions must pass before any integration work begins.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # tests/safety/ se incluye explicitamente: es la suite safety-critical y
      # hasta ahora quedaba fuera de CI, ocultando sus fallos.
      # --junitxml produces machine-readable results for the GitHub summary
      - name: Run unit and safety tests
        run: |
          pytest tests/unit/ tests/safety/ -v --tb=short \
            --junitxml=test-results.xml \
            --cov --cov-report=term-missing --cov-fail-under=70

      # Uploading results lets reviewers inspect failures without re-running CI
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 3: Security Scan
  # Runs in parallel with unit-tests to save time.
  # Three complementary scanners:
  #   - Semgrep: SAST for Python code patterns and hardcoded secrets
  #   - Gitleaks: git-history scan for leaked credentials
  #   - pip-audit: checks Python dependencies against CVE databases
  # A safety-critical system must have zero tolerance for known vulnerabilities
  # or secret leakage before code reaches production.
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history required for Gitleaks to scan all commits
          fetch-depth: 0

      # Semgrep: static analysis with curated Python and secrets rulesets.
      # Pin por SHA completo (zero-trust supply chain): un tag/rama mutable
      # dejaría que un compromiso upstream se ejecutase con los secretos del
      # pipeline. SHA = tag v1 de returntocorp/semgrep-action. NOTA: ese repo
      # está archivado; migrar a semgrep/semgrep-action es deuda pendiente.
      # dependabot mantiene el pin actualizado.
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/python
            p/secrets

      # Gitleaks: scans the entire git history for accidentally committed secrets
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # pip-audit: checks all installed packages against OSV/PyPI advisory database
      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit

  # ---------------------------------------------------------------------------
  # Job 4: Build & Push
  # Only runs on push to main or version tags — never on feature branches.
  # Trivy scans the built image; push is skipped if any *fixable* CRITICAL CVE
  # is found (ignore-unfixed=true). This enforces that no fixable critical
  # vulnerability reaches GCR and eventually GKE.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [unit-tests, security-scan]
    # Only publish from main branch or semantic version tags
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate to Google Container Registry using the CI service account key
      - name: Authenticate to GCR
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/reactorguard-api:${{ github.sha }} \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/reactorguard-api:latest \
            -f api/Dockerfile \
            .

      # Trivy: container vulnerability scanner — blocks push if CRITICAL CVEs found.
      # A container with known critical vulnerabilities must never run in a
      # safety-critical nuclear monitoring environment.
      # Pin por SHA completo en vez de @master (rama mutable): zero-trust supply
      # chain. SHA = release v0.36.0 de aquasecurity/trivy-action; dependabot
      # mantiene el pin actualizado.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gcr.io/${{ secrets.GCP_PROJECT_ID }}/reactorguard-api:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      # Push only after Trivy passes — guarantee: every image in GCR is clean
      - name: Push Docker image to GCR
        run: |
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/reactorguard-api:${{ github.sha }}
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/reactorguard-api:latest
