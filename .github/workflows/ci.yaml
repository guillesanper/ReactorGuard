# CI Pipeline — ReactorGuard
# Safety-critical system: every commit must pass lint, tests, and security scans
# before a container image is built and pushed to the registry.
#
# Job order:
#   lint-and-typecheck → unit-tests ──┐
#                     → security-scan ┴→ build-and-push

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: gcr.io
  # Indice de ruedas CPU de PyTorch: sin el, pip descarga torch con CUDA (varios
  # GB de librerias nvidia) que ningun job de CI usa.
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint & Type-check
  # Catches style violations and type errors early — cheap and fast.
  # For a safety-critical system, type correctness prevents subtle runtime bugs
  # in sensor validation and anomaly detection logic.
  # ---------------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # mypy necesita el proyecto y sus dependencias instaladas: sin numpy,
      # pandas o pyarrow los trata como Any y los alias de tipos que se apoyan
      # en ellos dejan de ser validos. ruff y mypy van fijados en el extra dev.
      - name: Install project and dev tools
        run: pip install -e ".[dev]"

      # ruff: sin --select, para heredar el select de [tool.ruff.lint] en
      # pyproject.toml. Una sola fuente de verdad: CI no puede ser mas laxo que
      # la configuracion del repo.
      - name: Run ruff
        run: ruff check .

      # mypy: static type analysis — critical for catching type errors in ML/physics code.
      # Sin flags: strict e ignore_missing_imports salen de [tool.mypy] en
      # pyproject.toml, la misma configuracion que se usa en local.
      - name: Run mypy
        run: mypy ml/ api/ data/

  # ---------------------------------------------------------------------------
  # Job 2: Unit Tests
  # Validates core logic in isolation — physics constraints, sensor validators,
  # and ML utility functions must pass before any integration work begins.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # tests/safety/ se incluye explicitamente: es la suite safety-critical y
      # hasta ahora quedaba fuera de CI, ocultando sus fallos.
      # --junitxml produces machine-readable results for the GitHub summary
      - name: Run unit and safety tests
        run: |
          pytest tests/unit/ tests/safety/ -v --tb=short \
            --junitxml=test-results.xml \
            --cov --cov-report=term-missing --cov-fail-under=70

      # Uploading results lets reviewers inspect failures without re-running CI
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 3: Security Scan
  # Runs in parallel with unit-tests to save time.
  # Three complementary scanners:
  #   - Semgrep: SAST for Python code patterns and hardcoded secrets
  #   - Gitleaks: git-history scan for leaked credentials
  #   - pip-audit: checks Python dependencies against CVE databases
  # A safety-critical system must have zero tolerance for known vulnerabilities
  # or secret leakage before code reaches production.
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history required for Gitleaks to scan all commits
          fetch-depth: 0

      # Gitleaks: scans the entire git history for accidentally committed secrets.
      # Lee .gitleaks.toml (reglas por defecto + falsos positivos justificados).
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Semgrep: static analysis with curated Python and secrets rulesets.
      # Se ejecuta la CLI fijada por version en lugar de returntocorp/semgrep-action,
      # que esta archivado; pipx la aisla para que sus dependencias no entren en
      # el entorno que audita pip-audit. --error falla con cualquier hallazgo.
      # Los falsos positivos puntuales llevan `# nosemgrep: <regla>` en linea,
      # junto a su justificacion. Regla excluida entera:
      #   is-function-without-parentheses: heuristica por nombre (is_*) que no
      #     distingue @property, atributos ni callbacks pasados a proposito
      #     (liveness=heartbeat.is_alive). El fallo real que busca (una funcion
      #     usada como booleano) ya lo detecta mypy strict con truthy-function.
      - name: Run Semgrep
        run: |
          pipx run semgrep==1.183.0 scan --error --metrics=off \
            --config p/python \
            --config p/secrets \
            --exclude-rule python.lang.maintainability.is-function-without-parentheses.is-function-without-parentheses

      # pip-audit audita el entorno en el que corre: hay que instalar antes el
      # proyecto para que revise las dependencias reales y no el Python vacio
      # del runner. --skip-editable omite el propio paquete reactorguard, que no
      # esta publicado en PyPI.
      # Vulnerabilidad ignorada, con justificacion:
      #   PYSEC-2026-2447 (CVE-2025-69872, diskcache <= 5.6.3): diskcache
      #     deserializa con pickle, asi que quien pueda escribir en el directorio
      #     de cache puede ejecutar codigo. No hay version corregida. Solo llega
      #     como dependencia de dvc (dvc-data), que lo usa en la cache local del
      #     repositorio (.dvc/tmp) de la maquina del desarrollador; ningun servicio
      #     de la imagen lo importa. Revisar cuando diskcache publique un parche.
      # pip tambien entra en la auditoria: se actualiza para no arrastrar los
      # CVE de la version que trae el runner.
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit --skip-editable --ignore-vuln PYSEC-2026-2447

  # ---------------------------------------------------------------------------
  # Job 4: Build & Push
  # Builds the image and scans it with Trivy on pull requests to main and on
  # pushes to main or version tags. It is only pushed to GCR from main or a
  # version tag, and only when the GCP secrets exist: without them (no
  # infrastructure deployed yet) the job builds and scans the local image and
  # stops there, so the Dockerfile and the Trivy gate are still checked.
  # Trivy blocks the push if any *fixable* CRITICAL CVE is found
  # (ignore-unfixed=true), so no fixable critical vulnerability reaches GCR and
  # eventually GKE.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [unit-tests, security-scan]
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))

    # Los secretos no pueden usarse en un `if:`; copiados a env si. Un secreto
    # que no existe se expande a cadena vacia.
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      LOCAL_IMAGE: reactorguard-api:${{ github.sha }}
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Report publishing mode
        run: |
          if [ "$PUBLISH" = "true" ] && [ -n "$GCP_SA_KEY" ] && [ -n "$GCP_PROJECT_ID" ]; then
            echo "The image will be pushed to $REGISTRY after the Trivy scan."
          else
            echo "::notice::Build and scan only: the image is not pushed (not main/tag, or GCP_SA_KEY / GCP_PROJECT_ID are not set)."
          fi

      # Authenticate to Google Container Registry using the CI service account key
      - name: Authenticate to GCR
        if: env.PUBLISH == 'true' && env.GCP_SA_KEY != '' && env.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        if: env.PUBLISH == 'true' && env.GCP_SA_KEY != '' && env.GCP_PROJECT_ID != ''
        run: gcloud auth configure-docker gcr.io --quiet

      # Se construye con una etiqueta local; las etiquetas de GCR se anaden
      # justo antes del push, que es el unico paso que necesita el proyecto.
      - name: Build Docker image
        run: docker build -t "$LOCAL_IMAGE" -f api/Dockerfile .

      # Trivy: container vulnerability scanner — blocks push if CRITICAL CVEs found.
      # A container with known critical vulnerabilities must never run in a
      # safety-critical nuclear monitoring environment.
      # Pin por SHA completo en vez de @master (rama mutable): zero-trust supply
      # chain. SHA = release v0.36.0 de aquasecurity/trivy-action; dependabot
      # mantiene el pin actualizado.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      # Push only after Trivy passes — guarantee: every image in GCR is clean
      - name: Push Docker image to GCR
        if: env.PUBLISH == 'true' && env.GCP_SA_KEY != '' && env.GCP_PROJECT_ID != ''
        run: |
          image="$REGISTRY/$GCP_PROJECT_ID/reactorguard-api"
          docker tag "$LOCAL_IMAGE" "$image:${{ github.sha }}"
          docker tag "$LOCAL_IMAGE" "$image:latest"
          docker push "$image:${{ github.sha }}"
          docker push "$image:latest"
