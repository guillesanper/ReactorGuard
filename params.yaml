# =============================================================================
# ReactorGuard — Experiment Parameters
# Tracked by DVC. Edit here; DVC picks up changes automatically.
# =============================================================================

# -----------------------------------------------------------------------------
# Tennessee Eastman Process pipeline  (data/generators/tep_*.py)
#
# Unica seccion que los stages de dvc.yaml declaran bajo `params:` y que el
# codigo lee de verdad, via data/generators/tep_params.py. Cambiar cualquier
# valor de aqui invalida los stages correspondientes en el proximo `dvc repro`.
# -----------------------------------------------------------------------------
tep:
  # Rutas del pipeline. raw_dir es el out de download_tep; processed_dir vive
  # fuera de raw_dir a proposito, porque anidar el out de adapt_tep dentro del
  # out de download_tep es una colision de outs que DVC rechaza.
  raw_dir: data/raw/tep
  processed_dir: data/processed/tep
  reports_dir: data/reports

  # Identidad de planta estampada en cada SensorReading
  plant_id: "TEP-PLANT-01"

  # Serie temporal sintetica: el TEP no trae timestamps, se generan a intervalo
  # fijo desde este origen. 3 minutos es el periodo de muestreo del benchmark.
  start_time: "2000-01-01T00:00:00+00:00"
  sample_interval_minutes: 3

  # Tabla de spans calibrados por transmisor, usada para escalar value ->
  # raw_counts. Sustituye al antiguo adc_scale_max, un denominador global de
  # 3000.0 que saturaba a 65535 el 5,86% de las lecturas (32.259 de 550.160, en
  # XMEAS-02, -03, -07 y -16, cuyo maximo real es 5.003,7) y que al mismo tiempo
  # dejaba las composiciones de ~30 mol% ocupando el 1% del rango del ADC.
  #
  # Solo la RUTA es un parametro; el contenido del fichero se declara como `deps`
  # del stage, porque 52 entradas en params.yaml serian ilegibles y DVC versiona
  # ficheros por hash igual de bien. Se genera con derive_sensor_spans.py.
  spans_path: configs/sensor_spans.yaml

  # Campos de SensorMetadata (sinteticos: el dataset no los proporciona)
  calibration_date: "2023-06-01"
  last_maintenance_date: "2023-12-01"
  drift_coefficient: 0.0001

# -----------------------------------------------------------------------------
# Simulation parameters  (data/generators/reactor_simulator.py)
# -----------------------------------------------------------------------------
simulation:
  # Total number of time-step samples to generate per run
  n_samples: 50000

  # Fraction of samples that will have a fault injected [0.0 – 1.0]
  # 0.05 = 5 % anomalous samples (class imbalance typical for nuclear data)
  fault_injection_rate: 0.05

  # OpenMC random seed for reproducible neutron-transport calculations
  # Change to generate a different dataset split
  openmc_seed: 42

  # Sampling interval in seconds (matches real reactor SCADA polling rate)
  dt_seconds: 1.0

  # Reactor operating conditions
  nominal_power_mw: 3000.0       # Nominal thermal power [MWth]
  coolant_temp_nominal_k: 564.0  # Nominal coolant outlet temperature [K]
  fuel_temp_nominal_k: 900.0     # Nominal fuel centreline temperature [K]

  # Fault types to inject (subset of all available faults)
  fault_types:
    - loss_of_coolant          # LOCA
    - reactivity_insertion     # RIA
    - steam_generator_tube_rupture
    - loss_of_feedwater

# -----------------------------------------------------------------------------
# Feature engineering parameters  (ml/features/)
# -----------------------------------------------------------------------------
features:
  # Rolling-window sizes for statistical features [seconds]
  window_sizes: [10, 30, 60, 300]

  # Number of lag features per sensor
  n_lags: 5

  # Politica de seleccion de sensores.
  #
  # Sustituye a la lista sensor_channels, que enumeraba los 8 canales de un
  # schema plano que ya no existe. Enumerar en su lugar los 52 tags del TEP
  # habria repetido el mismo error un nivel mas arriba: cablear el inventario de
  # una planta concreta en la configuracion de features. El featurizer resuelve
  # el conjunto real desde los datos y lo contrasta contra expected_sensor_count,
  # de modo que una deriva de schema falla en voz alta en lugar de propagarse
  # silenciosamente a las features.
  sensor_selection:
    include_types: [flow, pressure, thermocouple, normalized, position]
    exclude_sensor_ids: []
    expected_sensor_count: 52

# -----------------------------------------------------------------------------
# Training parameters  (ml/training/train.py)
# -----------------------------------------------------------------------------
training:
  # Optimiser
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  optimizer: "adamw"            # adamw | sgd

  # Batch & epochs
  batch_size: 256
  max_epochs: 100
  early_stopping_patience: 10

  # Physics-informed loss weight (λ in L = L_data + λ·L_physics)
  # Higher → more physics constraint, lower → data-driven
  physics_lambda: 0.1

  # Model architecture
  hidden_size: 256              # Hidden layer width
  n_layers: 4                   # Number of hidden layers
  dropout: 0.2

  # Train/val/test split ratios (must sum to 1.0)
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

  # Random seed for reproducibility
  seed: 42

# -----------------------------------------------------------------------------
# Serving / inference parameters  (ml/serving/)
# -----------------------------------------------------------------------------
serving:
  # MAPIE conformal prediction confidence level [0.0 – 1.0]
  # 0.95 = 95 % prediction intervals
  confidence_level: 0.95

  # Anomaly detection threshold (prediction interval exceedance)
  anomaly_threshold: 3.0        # σ above nominal prediction interval

  # Maximum inference latency SLA [milliseconds]
  latency_sla_ms: 100

# -----------------------------------------------------------------------------
# DVC pipeline stages (do not edit — managed by dvc.yaml)
# -----------------------------------------------------------------------------
# dvc:
#   stages: [simulate, featurize, train, evaluate, register]
