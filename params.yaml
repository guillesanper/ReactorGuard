# =============================================================================
# ReactorGuard — Experiment Parameters
# Tracked by DVC. Edit here; DVC picks up changes automatically.
# =============================================================================

# -----------------------------------------------------------------------------
# Tennessee Eastman Process pipeline  (data/generators/tep_*.py)
#
# Unica seccion que los stages de dvc.yaml declaran bajo `params:` y que el
# codigo lee de verdad, via data/generators/tep_params.py. Cambiar cualquier
# valor de aqui invalida los stages correspondientes en el proximo `dvc repro`.
# -----------------------------------------------------------------------------
tep:
  # Rutas del pipeline. raw_dir es el out de download_tep; processed_dir vive
  # fuera de raw_dir a proposito, porque anidar el out de adapt_tep dentro del
  # out de download_tep es una colision de outs que DVC rechaza.
  raw_dir: data/raw/tep
  processed_dir: data/processed/tep
  reports_dir: data/reports

  # Identidad de planta estampada en cada SensorReading
  plant_id: "TEP-PLANT-01"

  # Serie temporal sintetica: el TEP no trae timestamps, se generan a intervalo
  # fijo desde este origen. 3 minutos es el periodo de muestreo del benchmark.
  start_time: "2000-01-01T00:00:00+00:00"
  sample_interval_minutes: 3

  # Tabla de spans calibrados por transmisor, usada para escalar value ->
  # raw_counts. Sustituye al antiguo adc_scale_max, un denominador global de
  # 3000.0 que saturaba a 65535 el 5,86% de las lecturas (32.259 de 550.160, en
  # XMEAS-02, -03, -07 y -16, cuyo maximo real es 5.003,7) y que al mismo tiempo
  # dejaba las composiciones de ~30 mol% ocupando el 1% del rango del ADC.
  #
  # Solo la RUTA es un parametro; el contenido del fichero se declara como `deps`
  # del stage, porque 52 entradas en params.yaml serian ilegibles y DVC versiona
  # ficheros por hash igual de bien. Se genera con derive_sensor_spans.py.
  spans_path: configs/sensor_spans.yaml

  # Campos de SensorMetadata (sinteticos: el dataset no los proporciona)
  calibration_date: "2023-06-01"
  last_maintenance_date: "2023-12-01"
  drift_coefficient: 0.0001

# -----------------------------------------------------------------------------
# Simulation parameters  (data/generators/reactor_simulator.py)
# -----------------------------------------------------------------------------
simulation:
  # Total number of time-step samples to generate per run
  n_samples: 50000

  # Fraction of samples that will have a fault injected [0.0 – 1.0]
  # 0.05 = 5 % anomalous samples (class imbalance typical for nuclear data)
  fault_injection_rate: 0.05

  # OpenMC random seed for reproducible neutron-transport calculations
  # Change to generate a different dataset split
  openmc_seed: 42

  # Sampling interval in seconds (matches real reactor SCADA polling rate)
  dt_seconds: 1.0

  # Reactor operating conditions
  nominal_power_mw: 3000.0       # Nominal thermal power [MWth]
  coolant_temp_nominal_k: 564.0  # Nominal coolant outlet temperature [K]
  fuel_temp_nominal_k: 900.0     # Nominal fuel centreline temperature [K]

  # Fault types to inject (subset of all available faults)
  fault_types:
    - loss_of_coolant          # LOCA
    - reactivity_insertion     # RIA
    - steam_generator_tube_rupture
    - loss_of_feedwater

# -----------------------------------------------------------------------------
# Feature engineering parameters  (ml/features/)
# -----------------------------------------------------------------------------
features:
  # Raiz del arbol de features, particionado por fault_type igual que el parquet
  # de lecturas. Es el out del stage featurize.
  features_dir: data/processed/features

  # Ventanas moviles en MUESTRAS, no en segundos.
  #
  # Sustituye a window_sizes: [10, 30, 60, 300], que estaban en segundos y venian
  # del TDD 5.5, escrito asumiendo el sondeo SCADA de 1 s. A los 180 s de muestreo
  # del TEP tres de esos cuatro valores caen POR DEBAJO DE UNA MUESTRA: una
  # ventana de 60 s no contiene ninguna y su desviacion tipica sale NaN. Es el
  # mismo fallo de cadencia medido en el umbral de deriva del validador, y aqui
  # sale mas caro, porque produce columnas vacias que un modelo de Fase 4
  # entrenaria como si fuesen senal.
  #
  # A 180 s: 10 muestras = 30 min, 20 = 1 h, 60 = 3 h.
  window_samples: [10, 20, 60]

  # Muestras minimas para emitir la estadistica de una ventana. Por debajo la
  # celda queda nula en lugar de llevar un numero inventado sobre uno o dos
  # puntos. Una std sobre una sola muestra vale cero, que es indistinguible de un
  # canal genuinamente plano.
  min_samples_per_window: 3

  # Number of lag features per sensor
  n_lags: 5

  # Parejas cuyo coeficiente de Pearson movil se emite como feature.
  #
  # Vacio a proposito, por el mismo motivo que baseline_correlations en
  # CrossCorrelationChecker: la tabla de parejas correlacionadas del TEP es una
  # calibracion que nadie ha derivado todavia, e inventarla aqui seria cablear una
  # suposicion sobre la planta.
  correlation_pairs: []

  # Politica de seleccion de sensores.
  #
  # Sustituye a la lista sensor_channels, que enumeraba los 8 canales de un
  # schema plano que ya no existe. Enumerar en su lugar los 52 tags del TEP
  # habria repetido el mismo error un nivel mas arriba: cablear el inventario de
  # una planta concreta en la configuracion de features. El featurizer resuelve
  # el conjunto real desde los datos y lo contrasta contra expected_sensor_count,
  # de modo que una deriva de schema falla en voz alta en lugar de propagarse
  # silenciosamente a las features.
  sensor_selection:
    include_types: [flow, pressure, thermocouple, normalized, position]
    exclude_sensor_ids: []
    expected_sensor_count: 52

# -----------------------------------------------------------------------------
# Streaming parameters  (data/streaming/, streamer y consumidor de validacion)
#
# Leidos via data/streaming/streaming_params.py. Ningun stage de dvc.yaml los
# declara: son configuracion de servicios, no de reproduccion de datos.
# Endpoints y credenciales de Kafka NO viven aqui: solo en variables de entorno
# KAFKA_* (data/streaming/kafka_settings.py).
#
# Calibracion a la cadencia del TEP (180 s, tep.sample_interval_minutes), no a la
# del TDD (1 s): ver staleness_seconds. Los parametros de rendimiento del
# productor (linger, batch, in-flight) son valores INICIALES; el benchmark de M5
# los fija con datos.
# -----------------------------------------------------------------------------
streaming:
  # Topics y grupo. El grupo es el que autoriza k8s/base/kafka/kafka-users.yaml.
  raw_topic: sensor-readings-raw
  validated_topic: sensor-validated
  alerts_topic: anomaly-alerts
  consumer_group: sensor-validator

  # Consumidor. auto_offset_reset=earliest: un grupo nuevo no debe saltarse las
  # lecturas ya publicadas. isolation_level=read_uncommitted porque el productor
  # no es transaccional (read_committed solo anadiria latencia).
  poll_timeout_ms: 1000
  max_poll_records: 500
  auto_offset_reset: earliest
  isolation_level: read_uncommitted

  # Commit sincrono tras publicar (at-least-once). Peor caso de un lote:
  #   flush_timeout_s + (commit_retries + 1) * commit_timeout_ms
  #   = 30 s + 4 * 30 s = 150 s,
  # que debe quedar por debajo de max_poll_interval_ms (300 s) o Kafka expulsa al
  # consumidor del grupo a mitad de lote. El loader lo valida. El computo del lote
  # es despreciable: validador p99 0,23 ms por lectura, 500 lecturas = 115 ms.
  commit_retries: 3
  commit_timeout_ms: 30000
  close_timeout_ms: 5000
  max_poll_interval_ms: 300000

  # Productor. Orden por sensor: idempotencia (fija en el adaptador) garantiza el
  # orden con max_in_flight <= 5. lz4 reduce bytes en red a coste de CPU bajo.
  # linger de 10 ms es despreciable frente a un intervalo de 180 s y permite
  # agrupar en el modo rapido. delivery_timeout_ms >= linger + request_timeout.
  compression_type: lz4          # none | gzip | snappy | lz4 | zstd
  batch_linger_ms: 10
  producer_batch_bytes: 131072
  max_in_flight_requests: 5
  request_timeout_ms: 30000
  delivery_timeout_ms: 120000
  flush_timeout_s: 30.0

  # Observabilidad. 0.0.0.0 porque el kubelet y Prometheus acceden por la IP del
  # pod; el acceso lo restringen las NetworkPolicies, no el bind.
  bind_host: "0.0.0.0"
  health_port: 8000
  metrics_port: 9090

  # Tiempo sin latido tras el cual /health devuelve 503. El silencio legitimo mas
  # largo es el del streamer en modo realtime: una espera de 180 s entre lotes.
  # 540 s = 3 intervalos (mismo factor que el TTL de Feast): tolera dos lotes
  # perdidos antes de reiniciar el pod. Con 30 s (valor heredado del TDD) el pod
  # se reiniciaria en cada espera. El test lo exige >= 2 intervalos.
  staleness_seconds: 540

# -----------------------------------------------------------------------------
# Storage parameters  (data/storage/, cliente de almacenamiento de lecturas)
#
# Leidos via data/storage/storage_params.py. Ningun stage de dvc.yaml los
# declara: son configuracion de servicios, no de reproduccion de datos.
#
# bucket_prefix y env DEBEN coincidir con infra/terraform (locals.bucket_prefix y
# locals.env del entorno dev): los nombres de bucket se derivan de ellos y
# tests/unit/test_storage_params.py los contrasta con modules/storage/main.tf.
# -----------------------------------------------------------------------------
storage:
  bucket_prefix: reactorguard
  env: dev

  # Raiz del backend en disco (LocalCache). Bajo data/processed/ a proposito: ya
  # esta en .gitignore y no es un out de DVC, asi que no ensucia ni el arbol ni
  # `dvc status`.
  local_root: data/processed/local_store

  # Hilos de lectura de partes. Una hora de TEP son 20 muestras x 52 sensores,
  # es decir, partes de decenas de KB: el cuello es la latencia por objeto, no el
  # ancho de banda. Valor inicial; se fija midiendo contra el bucket del cluster.
  read_workers: 4

  # Timeout de una operacion contra el almacen. Del mismo orden que
  # streaming.flush_timeout_s: una escritura en el camino de un lote no debe
  # consumir mas margen del que el lote ya reserva frente a max_poll_interval_ms.
  # No medido todavia (requiere el bucket real).
  request_timeout_s: 30.0

# -----------------------------------------------------------------------------
# Training parameters  (ml/training/train.py)
# -----------------------------------------------------------------------------
training:
  # Optimiser
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  optimizer: "adamw"            # adamw | sgd

  # Batch & epochs
  batch_size: 256
  max_epochs: 100
  early_stopping_patience: 10

  # Physics-informed loss weight (λ in L = L_data + λ·L_physics)
  # Higher → more physics constraint, lower → data-driven
  physics_lambda: 0.1

  # Model architecture
  hidden_size: 256              # Hidden layer width
  n_layers: 4                   # Number of hidden layers
  dropout: 0.2

  # Train/val/test split ratios (must sum to 1.0).
  #
  # El corte es TEMPORAL DENTRO DE CADA fault_type: cada particion aporta sus
  # primeros timesteps a train, los siguientes a val y los ultimos a test. Asi el
  # reparto es estratificado (las 22 clases estan en los tres splits) sin dejar de
  # respetar el orden temporal. El sobrante de la division entera va a test, de
  # modo que no se pierde ninguna muestra.
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

  # Salidas del stage split
  splits_dir: data/processed/splits
  # Fuera de data/ a proposito: son ficheros pequenos que SI se versionan en git,
  # que es lo que permite a `dvc metrics diff` comparar dos commits.
  #
  # Van separados porque `dvc metrics show` aplana el JSON en una columna por
  # hoja: meter el recuento de las 22 clases por cada split daba 66 columnas que
  # en un terminal no se leen. metrics_path lleva las cifras de cabecera y
  # distribution_path el desglose completo.
  metrics_path: metrics/split_metrics.json
  distribution_path: metrics/split_distribution.json

  # Random seed for reproducibility
  seed: 42

# -----------------------------------------------------------------------------
# Serving / inference parameters  (ml/serving/)
# -----------------------------------------------------------------------------
serving:
  # MAPIE conformal prediction confidence level [0.0 – 1.0]
  # 0.95 = 95 % prediction intervals
  confidence_level: 0.95

  # Anomaly detection threshold (prediction interval exceedance)
  anomaly_threshold: 3.0        # σ above nominal prediction interval

  # Maximum inference latency SLA [milliseconds]
  latency_sla_ms: 100

# -----------------------------------------------------------------------------
# DVC pipeline stages (do not edit — managed by dvc.yaml)
# -----------------------------------------------------------------------------
# dvc:
#   stages: [simulate, featurize, train, evaluate, register]
